name: Build Rose

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=https://goproxy.cn,direct
          go env -w GOSUMDB=off

      - name: Download dependencies
        run: |
          for i in 1 2 3; do
            go mod download && break
            echo "Retry $i..."
            sleep 5
          done

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o rose-darwin-amd64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rose-darwin-amd64
          path: rose-darwin-amd64
