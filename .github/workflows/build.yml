name: Build Rose

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ===== 新增：构建前端 =====
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: |
          # 根据项目实际使用的包管理器选择：
          # 如果有 pnpm-lock.yaml，用 pnpm
          # 如果有 yarn.lock，用 yarn
          # 如果只有 package-lock.json 或没有锁文件，用 npm
          if [ -f pnpm-lock.yaml ]; then
            npm install -g pnpm && pnpm install
          elif [ -f yarn.lock ]; then
            yarn install
          else
            npm install
          fi

      - name: Build frontend
        working-directory: ./frontend
        run: |
          # 根据 package.json 中的 scripts 选择构建命令
          # 常见的是 npm run build，也可能是 pnpm build
          if [ -f pnpm-lock.yaml ]; then
            pnpm build
          elif [ -f yarn.lock ]; then
            yarn build
          else
            npm run build
          fi

      - name: Verify dist exists
        run: |
          ls -la frontend/dist/
      # ===== 前端构建结束 =====

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Configure Go proxy
        run: |
          go env -w GOPROXY=https://goproxy.cn,direct
          go env -w GOSUMDB=off

      - name: Download dependencies
        run: |
          for i in 1 2 3; do
            go mod download && break
            echo "Retry $i..."
            sleep 5
          done

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: go build -ldflags="-s -w" -o rose-darwin-amd64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rose-darwin-amd64
          path: rose-darwin-amd64
